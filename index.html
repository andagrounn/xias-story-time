<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xia's Story Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="app">
    <header class="app-header">
      <h1>Xia's Story Time <span class="moon">🌙</span></h1>
      <nav id="chips" class="chips" aria-label="Filter stories"></nav>
    </header>
    <section id="grid" class="grid" aria-label="Story books"></section>
    <div id="overlay" class="overlay hidden" aria-hidden="true" role="dialog" aria-modal="true"></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
